<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Previsão do Tempo - BrasilAPI</title>

  <!-- PWA: permite abrir como um "app" direto da tela inicial do celular -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2b6cb0" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Previsão do Tempo" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header>
    <h1>🌤️ Previsão do Tempo</h1>
    <p>Digite o nome de uma cidade e toque em buscar</p>
  </header>

  <main>
    <!-- Campo de busca -->
    <form id="formBusca" class="busca" autocomplete="off">
      <input
        type="search"
        id="inputCidade"
        placeholder="Ex: Jacareí"
        autocomplete="off"
        inputmode="search"
        enterkeyhint="search"
      />
      <button type="submit" id="botaoBuscar" aria-label="Buscar cidade">
        🔍
      </button>
    </form>

    <!-- Mensagem de status (Buscando... / erro) -->
    <p id="mensagemStatus"></p>

    <!-- Lista de cidades encontradas -->
    <section id="listaCidades" class="lista-cidades"></section>

    <!-- Resultado da previsão do tempo -->
    <section id="resultadoPrevisao" class="previsao"></section>
  </main>

  <footer>
    <p>Dados fornecidos pela <a href="https://brasilapi.com.br" target="_blank" rel="noopener">BrasilAPI</a></p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
